[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-agent"
version = "0.1.0"
description = "Obsidian 知识库管理 + B站视频理解工具"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1",
    "requests>=2.25",
    "Pillow>=9.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=7", "black", "isort", "flake8", "mypy"]

[tool.setuptools]
packages = ["bili_summarizer"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = "E203,W503"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["bili_summarizer"]
